# Events shown on /events/, split into three sections automatically:
# recurring (standing weekly events), upcoming (dated, today or later), and
# past (dated, before today). Add new events anywhere in this file — each
# section sorts/groups itself, so order here doesn't matter.
#
# type accepts: rehearsal, concert, social, jam
#
# date: "YYYY-MM-DD", 24-hour. Omit entirely for a recurring event (see
# `recurring` below) — don't set both.
#
# recurring: set instead of `date` for a standing weekly event (e.g. "Friday")
# — the date badge shows a loop icon and the day name instead of a month/day,
# and it always lives in its own section rather than being date-sorted.
#
# instagram_embed: optional — the full URL of an Instagram post
# (https://www.instagram.com/p/XXXXXXXXXXX/). If set, a "View on Instagram"
# link to it is shown on the event's card.
#
# youtube_playlist: optional — a YouTube playlist URL. If set, a "Watch on
# YouTube" link to it is shown on the event's card (e.g. recordings from
# that gig).

