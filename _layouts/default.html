<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  {% include navbar.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Bootstrap 5 JS bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Sprite-pattern backdrop (used by the Gallery section and by any
       .win98-icon-pattern hero that has no provided photo, e.g. Events,
       Members) — composited client-side from every sprite in
       assets/img/characters/players/, so new sprites show up automatically. -->
  <script>
    {% assign player_sprites = site.static_files | where_exp: "f", "f.path contains '/assets/img/characters/players/'" | sort: "name" %}
    window.LVGSO_PLAYER_SPRITES = [
      {% for f in player_sprites %}
      "{{ f.path | relative_url }}"{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ];
  </script>
  <script src="{{ '/assets/js/sprite-pattern.js' | relative_url }}" defer></script>
</body>
</html>
