<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<title>{% if page.title %}{{ page.title }} | {{ site.short_title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">

<link rel="icon" href="{{ '/assets/img/star.png' | relative_url }}" type="image/png">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<!-- LVGSO Windows 98-inspired theme (self-hosted Pixelated MS Sans Serif font).
     common.css holds shared chrome; page_css (set in front matter, or via
     collection defaults in _config.yml) adds the current page's own rules. -->
<link rel="stylesheet" href="{{ '/assets/css/common.css' | relative_url }}">
{% if page.page_css %}
<link rel="stylesheet" href="{{ '/assets/css/' | append: page.page_css | append: '.css' | relative_url }}">
{% endif %}

{% seo %}
